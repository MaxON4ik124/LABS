{% extends "base.html" %}

{% block title %}Вход — магазин за тугрики{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <article class="card auth-card">
        <h1>Вход</h1>
        <p class="muted">Войдите, чтобы покупать товары и смотреть заказы.</p>

        <form id="login-form" class="form">
            <label>
                Логин
                <input
                    id="username"
                    name="username"
                    type="text"
                    minlength="3"
                    maxlength="30"
                    autocomplete="username"
                    required
                >
            </label>

            <label>
                Пароль
                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="6"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button class="button button-primary" type="submit">
                Войти
            </button>
        </form>

        <p class="auth-link">
            Нет аккаунта?
            <a href="{{ url_for('register_page') }}">Зарегистрироваться</a>
        </p>
    </article>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
