<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ИКНК: Личный кабинет</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f5f5f5;
    }
    header {
      background: #4a2c6d;
      color: white;
      padding: 10px 20px;
      font-size: 18px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header img {
      height: 30px;
    }
    header a {
      color: white;
      text-decoration: none;
    }
    .content {
      margin-top: 70px;
    }
    .carousel {
      width: 100%;
      overflow: hidden;
      position: relative;
    }
    .carousel img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: -5px; /* убираем белую полоску */
    }
    .carousel-caption {
      position: absolute;
      bottom: 20%;
      left: 10%;
      color: white;
    }
    .carousel-caption h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .carousel-caption a {
      display: inline-block;
      padding: 10px 20px;
      background: #32004b;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .course-search {
      display: flex;
      justify-content: center;
      margin: 30px;
    }
    .course-search input[type=text] {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px 0 0 5px;
    }
    .course-search button {
      padding: 10px;
      font-size: 16px;
      background: #4a2c6d;
      color: white;
      border: none;
      border-radius: 0 5px 5px 0;
    }
    .categories {
      margin: 30px 20px;
    }
    .categories h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }
    .category {
      margin-left: 20px;
      margin-bottom: 8px;
    }
    .category a {
      color: #2a2a2a;
      text-decoration: none;
    }
    .numberofcourse {
      color: #666;
      font-size: 14px;
    }
    #search-section {
      display: none;
      padding: 20px;
    }
    #search-section.active {
      display: block;
    }
    #results {
      background: white;
      padding: 15px;
      margin-top: 10px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="https://dl.spbstu.ru/pluginfile.php/1/theme_mooc/logo/1749560362/123%401.5x.png" alt="logo">

        <h1>Инструкция по установке и<br>подключению Webinar</h1>
        <a href="https://youtu.be/PkT0PJwy8mI?si=LQ2AOoaZhKlWzG-x">Подробнее</a>

    </div>

      <div class="category">
        <a href="#">Бакалавриат</a> <span class="numberofcourse">(67)</span>
      </div>
      <div class="category">
        <a href="#">Специалитет</a> <span class="numberofcourse">(58)</span>
      </div>
    </div>
  </div>

    <input type="text" id="searchInput" placeholder="Введите ключевое слово..." oninput="searchQuestions()">
    <div id="results"></div>

    function searchQuestions() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (query.length < 2) return;

      for (const [key, value] of Object.entries(questions)) {
        if (value.toLowerCase().includes(query)) {
          const el = document.createElement("div");
          el.className = "result";
          el.textContent = value;
          resultsDiv.appendChild(el);
        }
      }

      if (!resultsDiv.children.length) {
        resultsDiv.innerHTML = "<em>Совпадений не найдено.</em>";
      }
    }

    function toggleSearchSection() {
      const section = document.getElementById("search-section");
      section.classList.toggle("active");
      window.scrollTo({ top: section.offsetTop - 60, behavior: 'smooth' });
    }

</body>
