apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-nginx-read-flask-secret-demo
  namespace: app
rules:
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - flask-users-secret
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-nginx-read-flask-secret-demo-binding
  namespace: app
subjects:
  - kind: ServiceAccount
    name: ingress-nginx
    namespace: ingress-nginx
roleRef:
  kind: Role
  name: ingress-nginx-read-flask-secret-demo
  apiGroup: rbac.authorization.k8s.io
