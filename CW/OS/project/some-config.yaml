apiVersion: v1
kind: ServiceAccount
metadata:
  name: limited-user
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: limited-user-ingress-and-secrets-role
  namespace: app
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    resourceNames:
      - auth-app-one-ingress
      - auth-app-two-ingress
      - auth-app-three-ingress
    verbs:
      - get
      - patch
      - update

  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: limited-user-ingress-and-secrets-binding
  namespace: app
subjects:
  - kind: ServiceAccount
    name: limited-user
    namespace: app
roleRef:
  kind: Role
  name: limited-user-ingress-and-secrets-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: limited-user-only-namespace-check
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - ingresses
  validations:
    - expression: >
        request.userInfo.username != "system:serviceaccount:app:limited-user"
        ||
        object.metadata.namespace == "app"
      message: "limited-user may update Ingress only in namespace app."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: limited-user-only-namespace-check-binding
spec:
  policyName: limited-user-only-namespace-check
  validationActions:
    - Deny